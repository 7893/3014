<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ede8db" />
    <meta
      name="description"
      content="一舟穿行古今。都市、度假、隐居，从亮马河到海南海湾与水墨山水，一段随机启程的旅程。"
    />
    <title>一舟古今 · 7893</title>
    <link rel="stylesheet" href="./assets/css/site.css" />
  </head>
  <body>
    <main aria-label="一舟古今，都市、度假与隐居三景旅程">
      <canvas
        id="landscape"
        aria-label="层山隐于云间，淡日映天，近岸松石，一舟浮于江上，游鱼点水。"
        role="img"
      ></canvas>
      <div class="inscription">
        <h1>山静日长</h1>
        <p>一水含天远<br />千山入梦深</p>
        <span class="signature">七八九三 · 写意</span>
        <span class="seal" aria-hidden="true">山<br />居</span>
      </div>
      <div class="colophon">
        <span class="work-mark" aria-hidden="true">山水无尽　·　心自闲</span>
        <nav class="scene-nav" aria-label="选择场景">
          <button type="button" data-scene="ink" aria-pressed="true">
            山静
          </button>
          <span aria-hidden="true">·</span>
          <button type="button" data-scene="city" aria-pressed="false">
            城光
          </button>
          <span aria-hidden="true">·</span>
          <button type="button" data-scene="coast" aria-pressed="false">
            海风
          </button>
        </nav>
      </div>
      <p class="sr-only" id="status" aria-live="polite"></p>
      <noscript
        ><p class="notice">
          此卷由程序绘就，请启用 JavaScript 展卷。
        </p></noscript
      >
    </main>
    <script type="module" src="./assets/js/main.js"></script>
  </body>
</html>
